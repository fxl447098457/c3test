name: VB6 C3 Regression

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  regression:
    name: Run-Tests (all)
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      # 交给脚本的 vswhere 自动发现 vcvarsall (无需显式设置)
      C3_VCVARSALL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Sanity — required dev tools (C3.exe, MSVC)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere missing (VS installer absent)" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC C++ tools found (needs VS C++ workload)" }
          Write-Host "MSVC install: $vsPath"

      - name: Run full regression
        run: powershell -ExecutionPolicy Bypass -File tests/run_tests.ps1 -Category all -Verbose

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/output/**/*.out
            tests/output/**/*.err
            tests/output/**/*.txt
            tests/output/**/*.dat
            tests/output/**/scores.txt
          if-no-files-found: warn
          retention-days: 14
