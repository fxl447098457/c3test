# ci_t0.yml - T0 最小编译门禁 (实验层)
#
# 与 ci.yml (push/PR 触发的全量回归) 完全独立, 本文件不被常规推送触发。
# 触发方式: 打 tag github-test-* 推送到 GitHub, 例如:
#   git tag github-test-001
#   git push <github 远端> github-test-001
# 内容: 构建 C3.exe -> tests_github/run_t0.ps1
#   (C3.exe 版本冒烟 + tests_github/t0_cases/*.bas 全量 --syntax-only + smoke.bas 编译运行断言)
# 用例与 tests/ 的关系见 tests_github/run_t0.ps1 头注释。

name: GitHub Tests T0+T1

on:
  push:
    tags:
      - 'github-test-*'

jobs:
  t0:
    name: T0 最小编译门禁（构建 + 语法 + 冒烟）
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # 交给脚本的 vswhere 自动发现 vcvarsall (无需显式设置)
      C3_VCVARSALL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Sanity — required dev tools (MSVC)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere missing (VS installer absent)" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC C++ tools found (needs VS C++ workload)" }
          Write-Host "MSVC install: $vsPath"
          cmake --version
          ninja --version

      - name: Cache C3.exe build dir (fast path when src/ untouched)
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/c3build
          key: c3build-${{ hashFiles('src/**', 'CMakeLists.txt', 'cmake/**') }}
          restore-keys: c3build-

      - name: Build C3.exe from source (never ship a vendored binary)
        shell: pwsh
        run: |
          # MSVC 官方只保证从 vcvarsall 拿到的环境有效; 这里在子进程里导出后注入当前进程。
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>$null
          if (-not $vsPath) { throw "No MSVC install" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          $envLines = & cmd /c "call `"$vcvars`" x64 >nul 2>&1 && set" 2>$null
          foreach ($line in $envLines) {
            if ($line -match '^([^=]+)=(.*)$') {
              [Environment]::SetEnvironmentVariable($matches[1], $matches[2], "Process")
            }
          }
          $buildDir = Join-Path $env:RUNNER_TEMP "c3build"
          cmake -S . -B $buildDir -G Ninja -DVB6C3_ENABLE_LLVM=OFF -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build $buildDir
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          Copy-Item (Join-Path $buildDir "C3.exe") .build\C3.exe -Force
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "built C3.exe smoke check failed" }

      - name: Upload C3.exe artifact (T1 job 复用, 不重复构建)
        uses: actions/upload-artifact@v4
        with:
          name: c3-exe
          path: .build/C3.exe
          if-no-files-found: error
          retention-days: 1

      - name: Run T0 gate (tests_github/run_t0.ps1)
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests_github/run_t0.ps1 -Verbose

      - name: Upload T0 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t0-logs
          path: |
            output/**/*.out
            output/**/*.err
          if-no-files-found: warn
          retention-days: 14

  t1:
    name: T1 最小回归（编译 + 运行 + 输出断言）
    needs: t0
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      # 交给脚本的 vswhere 自动发现 vcvarsall (无需显式设置)
      C3_VCVARSALL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Download C3.exe (T0 构建产物)
        uses: actions/download-artifact@v4
        with:
          name: c3-exe
          path: .build/

      - name: Smoke check downloaded C3.exe
        run: |
          & .build\C3.exe --version
          if ($LASTEXITCODE -ne 0) { throw "downloaded C3.exe broken" }

      # 复用 tests/run_tests.ps1 现有引擎与用例清单 (与 T0 同源, 无副本):
      #   bas 类 = 35 个纯 .bas 用例, 编译+运行+输出断言, PS7 下 -Jobs 20 并行
      #   compile 类 = 10 个只编译用例 (comprehensive x2 + 8 个 frm)
      # vbp/GUI 用例不进 T1 (窗口校验依赖本机环境, 留给后续夜间全量层)
      - name: "T1a bas 类 (35 个, 并行)"
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run_tests.ps1 -Category bas -Jobs 20 -Verbose

      - name: "T1b compile 类 (10 个)"
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/run_tests.ps1 -Category compile -Verbose

      - name: Upload T1 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-logs
          path: |
            output/**/*.out
            output/**/*.err
            output/**/*.txt
            output/**/scores.txt
          if-no-files-found: warn
          retention-days: 14
